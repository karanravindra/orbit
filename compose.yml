services:
  api:
    image: ${ORBIT_API_IMAGE:-orbit-api:local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "${API_PORT:-3000}:3000"
    env_file:
      - apps/api/.env
    environment:
      PORT: "3000"
      DATABASE_PATH: /data/orbit.sqlite
    volumes:
      - api-data:/data
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:3000/health/ready'); process.exit(r.ok ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  api-data:
