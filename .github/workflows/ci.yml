name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit
          POSTGRES_DB: orbit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit -d orbit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - run: bun run check

      - run: bun run typecheck

      # Regenerates the auth schema and migrations; any change means a
      # generated file is stale and needs committing.
      - name: Check generated schema is up to date
        run: |
          (cd apps/api && bun --env-file=.env.test run auth:generate)
          bun run db:generate
          git status --porcelain
          test -z "$(git status --porcelain)"

      - run: bun run --filter @orbit/api test:migrate

      - run: bun run test
